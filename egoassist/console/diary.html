<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人日记 · EgoAssist</title><link rel="icon" href="data:,"><link rel="stylesheet" href="diary.css"></head>
<body><header><a class="brand" href="/">EgoAssist</a><span>个人日记</span><a class="back" href="/" target="_blank" rel="noopener">回到助手 ↗</a></header>
<main><section id="login" hidden><h1>登录后回顾你的生活与工作</h1><form id="loginForm"><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><p>新用户可在<a href="/">助手首页</a>注册。</p></section>
<div id="app" hidden><div class="intro"><p class="eyebrow">留住经历，看见变化</p><h1>我的生活与工作</h1><p>把看见的、聊过的和记住的事，整理成可以回看的日记。</p></div>
<form id="generate" class="controls"><label>回顾周期<select id="kind"><option value="daily">日记</option><option value="weekly">周回顾</option><option value="monthly">月回顾</option></select></label><label>日期<input id="anchor" type="date" required></label><label>时区<input id="timezone" value="Asia/Shanghai" required aria-label="日记时区"></label><button type="button" class="secondary" id="findArchive">查看已有日记</button><button id="generateButton">整理这段时间</button></form>
<p id="status" role="status" aria-live="polite"></p><div class="layout"><article id="reading" aria-live="polite"><div class="empty"><h2>从一天开始</h2><p>选择日期整理日记。归档属于你的账户，切换会话也能继续阅读。</p></div></article>
<aside><h2>日记档案</h2><button type="button" class="secondary" id="allArchive">全部日记</button><div id="archive"></div><button id="more" hidden type="button">更早的日记</button><details class="settings"><summary>自动归档</summary><p>开启后，服务运行时自动整理最近结束的一天、一周和一月。更早的日期可手动补做。</p><label><input id="automatic" type="checkbox"> 自动整理日记、周回顾和月回顾</label><p id="scheduleStatus"></p></details></aside></div>
<section class="notes"><h2>给自己补一笔</h2><p>补记单独保存；重新整理相应周期后，会作为你的原话纳入日记。</p><form id="noteForm"><label>记录日期<input id="noteDay" type="date" required></label><label>想记住的事<textarea id="noteText" maxlength="10000" rows="4" required placeholder="今天发生了什么？有什么想法，或需要纠正的记录？"></textarea></label><button>保存补记</button></form></section></div>
</main><footer>日记根据已有记录整理。无记录不代表没有活动；建议供你选择，不会自动执行。</footer><script src="diary.js"></script></body></html>
