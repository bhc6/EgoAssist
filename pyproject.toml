[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoassist"
version = "0.1.0"
description = "Skill-first full-duplex embodied assistance framework with observable memory and intervention control"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "EgoAssist contributors" }]
keywords = ["embodied-assistant", "full-duplex", "egocentric", "long-term-memory", "skills"]

dependencies = [
    "numpy>=1.24,<3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tzdata>=2025.2",
    "pillow>=10",
    "aiohttp>=3.9",
    "dashscope>=1.23.9",
    "requests>=2.31",
    "pydantic>=2.13,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.18,<2",
    # LiveKit Agents 1.6.x currently resolves against the 1.39 OTel line.
    "opentelemetry-api>=1.39,<1.40",
    "opentelemetry-sdk>=1.39,<1.40",
    "temporalio>=1.31,<2",
    "livekit==1.1.13",
    "livekit-api==1.2.0",
    "livekit-agents==1.6.7",
    "protobuf>=6.33,<7",
]

[project.optional-dependencies]
# 云端作答后端
api = ["openai>=1.40", "google-generativeai>=0.8"]
# 本地模型作答 + 检索编码器（torch 按平台单独安装；FAISS 依赖为 CPU 版）
gpu = [
    "transformers>=4.49", "accelerate>=0.34", "qwen-vl-utils>=0.0.8",
    "bitsandbytes>=0.44", "open_clip_torch>=2.24", "pillow>=10",
    "opencv-python>=4.9", "faiss-cpu>=1.8", "sentencepiece",
]
dev = ["pytest>=8"]

[project.scripts]
egoassist = "run_egoassist:main"
egoassist-egolife = "run_egolife_benchmark:main"
egoassist-eval = "run_interaction_benchmark:main"

[tool.setuptools]
py-modules = ["run_egoassist", "run_egolife_benchmark", "run_interaction_benchmark"]
include-package-data = true

[tool.setuptools.package-data]
egoassist = [
    "prompts/*.json",
    "prompts/*.md",
    "watchlists/*.json",
    "console/*.html",
    "console/*.css",
    "console/*.js",
    "console/vendor/*.js",
    "skills/*/*.md",
    "skills/*/*.json",
    "skills/*/tasks/*.json",
    "skills/*/references/*.md",
    "skills/*/references/*.pdf",
]

[tool.setuptools.packages.find]
include = ["egoassist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
